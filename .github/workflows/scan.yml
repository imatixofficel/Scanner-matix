name: Scan Cloudflare Clean IPs

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run scanner
        run: python scanner.py
        timeout-minutes: 12

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/clean_ips.json data/history.json
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "Update IPs [$(date -u +%H:%M)]"
            git push
          fi
